<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SantitosIA</title>
  <script>
    (function () {
      var base = location.hostname === 'santyxs.github.io' ? '/SantitosIA/' : '/';
      var path = location.pathname;
      if (location.hostname === 'santyxs.github.io' && path.indexOf('/SantitosIA/') !== 0) {
        path = '/SantitosIA' + (path.charAt(0) === '/' ? path : '/' + path);
      }
      try {
        sessionStorage.setItem('spa-redirect', path + location.search + location.hash);
      } catch (_) {}
      location.replace(base);
    })();
  </script>
</head>
<body></body>
</html>
